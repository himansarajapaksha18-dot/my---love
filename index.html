<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY LOVE ❤️</title>
<style>
body { background: black; color: white; font-family: Arial; text-align: center; }
.red { color: red; }
input, button { padding: 10px; margin: 5px; border-radius: 8px; border: 1px solid red; background: #111; color: white; }
button { background: red; cursor: pointer; }
#chatBox { height: 300px; overflow-y: scroll; border: 1px solid red; padding: 10px; margin: 10px; }
.heart { position: fixed; font-size: 20px; color: red; animation: fall 3s linear infinite; }
@keyframes fall { to { transform: translateY(100vh); opacity: 0; } }
</style>
</head>
<body>
<div id="login">
  <h1 class="red">MY LOVE</h1>
  <input type="password" id="pass" placeholder="Enter 08-22">
  <button onclick="login()">Login</button>
</div>

<div id="app" style="display:none">
  <h1 class="red">❤️ For Us ❤️</h1>
  <div id="chatBox"></div>
  <input id="msg" placeholder="Type message">
  <button onclick="sendMsg()">Send</button>
  <br><br>
  <input type="file" id="photo">
  <button onclick="uploadPhoto()">Upload Photo</button>
  <div id="gallery"></div>
</div>

<script>
// 1. LOGIN CHECK
function login(){
  if(document.getElementById('pass').value == '08-22'){
    document.getElementById('login').style.display='none';
    document.getElementById('app').style.display='block';
    checkDates();
    setInterval(createHeart, 500);
  } else alert('Wrong password');
}

// 2. BIRTHDAY + ANNIVERSARY POPUP
function checkDates(){
  const today = new Date();
  if(today.getMonth()+1 == 8 && today.getDate() == 11) alert('Happy Birthday ❤️ 08-11');
  if(today.getMonth()+1 == 8 && today.getDate() == 22) alert('Happy Anniversary ❤️ 08-22');
}

// 3. HEARTS
function createHeart(){
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.innerHTML = '❤️';
  heart.style.left = Math.random()*100 + 'vw';
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(), 3000);
}

// 4. මෙතනට Supabase code එක පස්සේ දාමු - Chat + Photo
function sendMsg(){ alert('Supabase connect කරාට පස්සේ වැඩ') }
function uploadPhoto(){ alert('Supabase connect කරාට පස්සේ වැඩ') }
</script>
</body>
</html>
