<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himansa & Sanu ❤️</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    background: #000;
    color: #fff;
    overflow-x: hidden;
  }

  /* Falling Hearts */
.heart {
    position: fixed;
    top: -10vh;
    color: #ff0040;
    animation: fall linear infinite;
    z-index: 9999;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* Welcome Screen */
  #welcome {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #0a0a0a, #1a0000, #000);
    text-align: center;
    padding: 20px;
  }
  #welcome h1 {
    font-size: 3.2em;
    color: #ff0040;
    text-shadow: 0 0 25px #ff0040;
    animation: dropIn 1.5s ease;
  }
  #welcome h2 {
    font-size: 1.6em;
    color: #ff6680;
    margin-top: 15px;
    animation: dropIn 1.5s ease 0.5s both;
  }
  #passwordBox {
    margin-top: 30px;
    animation: dropIn 1.5s ease 1s both;
  }
  #passwordBox input {
    padding: 14px 25px;
    border-radius: 30px;
    border: 2px solid #ff0040;
    background: #1a0000;
    color: #fff;
    font-size: 1.2em;
    text-align: center;
    outline: none;
  }
  #passwordBox button {
    margin-top: 20px;
    padding: 14px 40px;
    background: linear-gradient(90deg, #ff0040, #990026);
    border: none;
    border-radius: 30px;
    color: white;
    font-size: 1.2em;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 25px #ff0040;
    transition: 0.3s;
  }
  #passwordBox button:hover { transform: scale(1.05); }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-50px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Main Content */
  #main { display: none; padding: 20px; max-width: 900px; margin: auto; }

.names {
    text-align: center;
    font-size: 2.8em;
    color: #ff0040;
    text-shadow: 0 0 20px #ff0040;
    animation: fadeInDown 1.5s ease;
    margin: 20px 0;
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Photo Album */
.album {
    position: relative;
    width: 100%;
    height: 450px;
    border-radius: 20px;
    overflow: hidden;
    border: 3px solid #ff0040;
    box-shadow: 0 0 40px rgba(255,0,64,0.6);
    margin: 20px 0;
  }
.album img {
    position: absolute;
    width: 100%; height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
.album img.active { opacity: 1; }

.love-text {
    text-align: center;
    color: #ff6680;
    font-size: 1.4em;
    margin: 20px 0;
    text-shadow: 0 0 10px #ff0040;
    animation: glow 2s infinite;
  }
  @keyframes glow { 0%,100%{text-shadow:0 0 10px #ff0040;} 50%{text-shadow:0 0 20px #ff0040;} }

  textarea {
    width:100%; height:100px; background:#1a0000;
    border:2px solid #ff0040; color:#fff;
    border-radius:10px; padding:10px; font-size:1em;
    outline: none;
  }

  /* Chat + Call */
.chat-container,.call-container {
    background: rgba(20,0,0,0.8);
    border: 2px solid #ff0040;
    border-radius: 20px;
    padding: 20px;
    margin-top: 30px;
    box-shadow: 0 0 30px rgba(255,0,64,0.3);
  }
  #messages { height: 300px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; }
.message { background: linear-gradient(90deg, #ff0040, #990026); padding: 10px 15px; border-radius: 15px; margin-bottom: 10px; word-wrap: break-word; }
.input-area { display: flex; gap: 10px; margin-top: 10px; }
  #messageInput { flex:1; padding:12px 20px; border-radius:25px; border:2px solid #ff0040; background:#1a0000; color:#fff; outline: none; }
.btn { padding:12px 25px; border-radius:25px; border:none; background:linear-gradient(90deg,#ff0040,#cc0033); color:white; font-weight:bold; cursor:pointer; transition: 0.3s; }
.btn:hover { transform: scale(1.05); }
.call-btn { width: 100%; padding: 15px; margin-top: 10px; background: #00ff80; color: #000; font-size: 1.1em; }
</style>
</head>
<body>

<div id="hearts"></div>

<!-- Welcome Screen -->
<div id="welcome">
  <h1>Himansa & Sanu ✨</h1>
  <h2>Welcome To My Love ❤️</h2>
  <div id="passwordBox">
    <input type="password" id="pwd" placeholder="08-22 ටයිප් කරන්න">
    <br>
    <button onclick="checkPassword()">ඇතුලට යන්න 💘</button>
  </div>
</div>

<!-- Main Site -->
<div id="main">
  <div class="names">Himansa & Sanu ✨</div>

  <!-- Photo Album -->
  <div class="album" id="album"></div>
  <input type="file" id="photoUpload" accept="image/*" multiple style="display:none">
  <button class="btn" onclick="document.getElementById('photoUpload').click()">📸 Gallery එකෙන් Photo Add කරන්න</button>

  <p class="love-text">හැමදාම මාත් එක්ක ඉන්න. මන් ඔයාට ගොඩක් ආදරෙයි මගෙ චූටි ❤️</p>

  <textarea id="desc" placeholder="ඔයාට කැමති description එකක් මෙතන ලියන්න..."></textarea>

  <!-- Call Room -->
  <div class="call-container">
    <h2 style="color:#ff6680; text-align:center;">Voice & Video Call 📞</h2>
    <button class="call-btn" onclick="window.open('https://ourlove.daily.co/chart', '_blank')">Call Room එකට Join වෙන්න</button>
  </div>

  <!-- Chat -->
  <div class="chat-container">
    <h2 style="color:#ff6680;">Our Chat 💌</h2>
    <div id="messages">Loading...</div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button class="btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// 1. Falling Hearts
function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '❤️';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = Math.random() * 20 + 10 + 'px';
  heart.style.animationDuration = Math.random() * 3 + 2 + 's';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 200);

// 2. Password Check
function checkPassword() {
  if(document.getElementById('pwd').value === '08-22') {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('main').style.display = 'block';
  } else {
    alert('වැරදියි බන් 😢 08-22 ගහන්න')
  }
}

// 3. Gallery Upload + LocalStorage + Slideshow
const album = document.getElementById('album');
const upload = document.getElementById('photoUpload');
let currentImg = 0;
let slideInterval;

window.onload = () => {
  const savedPhotos = JSON.parse(localStorage.getItem('myLovePhotos')) || [];
  if(savedPhotos.length === 0) {
    // Default 1 photo. ඔයාට ඕන නම් මකන්න
    savedPhotos.push("https://i.imgur.com/8Km9tLL.jpg");
  }
  savedPhotos.forEach(src => addPhotoToAlbum(src));
  startSlideshow();
  loadMessages();
  loadDesc();
}

function addPhotoToAlbum(src) {
  const img = document.createElement('img');
  img.src = src;
  if(album.children.length === 0) img.classList.add('active');
  album.appendChild(img);
}

upload.addEventListener('change', (e) => {
  const files = e.target.files;
  let savedPhotos = JSON.parse(localStorage.getItem('myLovePhotos')) || [];
  for(let file of files) {
    const reader = new FileReader();
    reader.onload = (event) => {
      const src = event.target.result;
      addPhotoToAlbum(src);
      savedPhotos.push(src);
      localStorage.setItem('myLovePhotos', JSON.stringify(savedPhotos));
      startSlideshow();
    }
    reader.readAsDataURL(file);
  }
})

function startSlideshow() {
  clearInterval(slideInterval);
  const imgs = document.querySelectorAll('.album img');
  if(imgs.length <= 1) return;
  slideInterval = setInterval(() => {
    imgs[currentImg].classList.remove('active');
    currentImg = (currentImg + 1) % imgs.length;
    imgs[currentImg].classList.add('active');
  }, 4000);
}

// 4. Description Save
const desc = document.getElementById('desc');
desc.oninput = () => localStorage.setItem('myLoveDesc', desc.value);
function loadDesc() { desc.value = localStorage.getItem('myLoveDesc') || ''; }

// 5. Supabase Chat
const SUPABASE_URL = 'https://rqugwdvkmzptqjngqjxk.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdWd3ZHZr
bXpwdHFqbmdxanhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzUwNDUsImV4cCI6MjA3NjAxMTA0NX0.0Xk9a6k2H3qQm4wQ5pR6sT7uV8wX9yZ0aB1cD2eF3g'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function loadMessages() {
  const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true })
  const messagesDiv = document.getElementById('messages')
  messagesDiv.innerHTML = ''
  data.forEach(msg => {
    messagesDiv.innerHTML += `<div class="message"><b>${msg.sender}:</b> ${msg.content}</div>`
  })
  messagesDiv.scrollTop = messagesDiv.scrollHeight
}
async function sendMessage() {
  const input = document.getElementById('messageInput')
  if (!input.value.trim()) return
  await supabase.from('messages').insert([{ sender: 'You', content: input.value }])
  input.value = ''; loadMessages()
}
setInterval(loadMessages, 2000)
</script>
</body>
</html>
