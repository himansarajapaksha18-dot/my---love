<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY LOVE ❤️</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; overflow-x: hidden; }

  /* Falling Hearts */
.heart { position: fixed; top: -10vh; color: #ff0040; animation: fall linear infinite; z-index: 9999; }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

  /* Pages */
.page { display: none; min-height: 100vh; padding: 20px; max-width: 900px; margin: auto; }
.page.active { display: block; }

  /* Welcome */
  #welcome { display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #0a0a0a, #1a0000); text-align: center; }
  #welcome h1 { font-size: 3em; color: #ff0040; text-shadow: 0 0 20px #ff0040; animation: fadeInUp 2s ease; }
  #welcome button { margin-top: 30px; padding: 15px 40px; background: linear-gradient(90deg, #ff0040, #990026); border: none; border-radius: 30px; color: white; font-size: 1.2em; cursor: pointer; box-shadow: 0 0 20px #ff0040; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  /* Names */
.names { text-align: center; font-size: 2.5em; color: #ff0040; text-shadow: 0 0 15px #ff0040; animation: pulse 2s infinite; margin: 20px 0; }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

  /* Photo Album */
.album { position: relative; width: 100%; height: 400px; border-radius: 20px; overflow: hidden; border: 3px solid #ff0040; box-shadow: 0 0 30px rgba(255,0,64,0.5); margin: 20px 0; background:#110000; }
.album img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 1s; }
.album img.active { opacity: 1; }
.add-photo-btn { display:block; margin:10px auto; padding:10px 20px; background:#ff0040; border:none; border-radius:20px; color:#fff; cursor:pointer; }

.love-text { text-align: center; color: #ff6680; font-size: 1.3em; margin: 20px 0; text-shadow: 0 0 10px #ff0040; }

  /* Nav */
.nav { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
.nav button { padding: 12px 25px; border-radius: 25px; border: 2px solid #ff0040; background: transparent; color: #ff0040; font-weight: bold; cursor: pointer; }
.nav button:hover { background: #ff0040; color: #000; }

  /* Chat */
.chat-container { background: rgba(20,0,0,0.8); border: 2px solid #ff0040; border-radius: 20px; padding: 20px; margin-top: 20px; }
  #messages { height: 350px; overflow-y: auto; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 15px; }
.message { background: linear-gradient(90deg, #ff0040, #990026); padding: 10px; border-radius: 15px; margin-bottom: 10px; }
.input-area { display: flex; gap: 10px; margin-top: 10px; }
  #messageInput { flex:1; padding:12px; border-radius:25px; border:2px solid #ff0040; background:#1a0000; color:#fff; }
  button.send { background:linear-gradient(90deg,#ff0040,#cc0033); color:white; font-weight:bold; cursor:pointer; border:none; padding:12px 25px; border-radius:25px; }

  /* Call */
  #call-container { width:100%; height:500px; border:2px solid #ff0040; border-radius:20px; margin:20px 0; background:#110000; }
.call-btns { display: flex; gap: 15px; justify-content: center; margin: 20px 0; }
.call-btn { padding: 15px 30px; background: #00ff80; border: none; border-radius: 30px; color: #000; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div id="hearts"></div>

<!-- PAGE 1: WELCOME -->
<div id="welcome" class="page active">
  <h1>Welcome To My Love ❤️</h1>
  <button onclick="showPage('home')">08-22 ඇතුලට යන්න 💘</button>
</div>

<!-- PAGE 2: HOME -->
<div id="home" class="page">
  <h1 style="text-align:center; color:#ff0040;">MY LOVE</h1>
  <div class="names">Himansa & Sanu ✨</div>

  <!-- Photo Album -->
  <div class="album" id="album">
    <!-- Default photos -->
    <img src="https://i.imgur.com/8Km9tLL.jpg" class="active">
  </div>
  <input type="file" id="photoInput" accept="image/*" style="display:none">
  <button class="add-photo-btn" onclick="document.getElementById('photoInput').click()">📸 Photo Add කරන්න</button>

  <p class="love-text">හැමදාම මාත් එක්ක ඉන්න. මන් ඔයාට ගොඩක් ආදරෙයි මගෙ චූටි ❤️</p>

  <textarea id="description" placeholder="Description එකක් මෙතන ලියන්න..." style="width:100%; height:80px; background:#1a0000; border:2px solid #ff0040; color:#fff; border-radius:10px; padding:10px;"></textarea>

  <div class="nav">
    <button onclick="showPage('chat')">💬 Chat</button>
    <button onclick="showPage('calls')">📞 Call</button>
  </div>
</div>

<!-- PAGE 3: CHAT -->
<div id="chat" class="page">
  <h2 style="text-align:center; color:#ff0040;">Our Chat 💌</h2>
  <div class="chat-container">
    <div id="messages">Loading...</div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button class="send" onclick="sendMessage()">Send</button>
    </div>
  </div>
  <div class="nav"><button onclick="showPage('home')">🏠 Home</button></div>
</div>

<!-- PAGE 4: CALLS -->
<div id="calls" class="page">
  <h2 style="text-align:center; color:#ff0040;">Voice & Video Call</h2>
  <div id="call-container"></div>
  <div class="call-btns">
    <button class="call-btn" onclick="startCall()">📹 Join Video Call</button>
    <button class="call-btn" style="background:#ff0040;" onclick="leaveCall()">❌ Leave Call</button>
  </div>
  <div class="nav"><button onclick="showPage('home')">🏠 Home</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@daily-co/daily-js"></script>
<script>
// 1. Falling Hearts
function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '❤️';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = Math.random() * 20 + 10 + 'px';
  heart.style.animationDuration = Math.random() * 3 + 2 + 's';
  document.getElementById('hearts').appendChild(heart);
  setTimeout(() => heart.remove(), 5000);
}
setInterval(createHeart, 300);

// 2. Page Switch
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 3. Photo Upload from Gallery
document.getElementById('photoInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = function(event){
      const img = document.createElement('img');
      img.src = event.target.result;
      document.getElementById('album').appendChild(img);
    }
    reader.readAsDataURL(file);
  }
});

// 4. Photo Slideshow
let currentImg = 0;
setInterval(() => {
  const imgs = document.querySelectorAll('.album img');
  if(imgs.length > 0){
    imgs[currentImg].classList.remove('active');
    currentImg = (currentImg + 1) % imgs.length;
    imgs[currentImg].classList.add('active');
  }
}, 3000);

// 5. Daily.co Video Call
let callFrame;
function startCall() {
  const container = document.getElementById('call-container');
  callFrame = window.DailyIframe.createFrame(container);
  callFrame.join({ url: 'https://ourlove.daily.co/chat' }); // ඔයාගේ URL එක
}
function leaveCall() {
  if(callFrame) { callFrame.leave(); callFrame.destroy(); }
}

// 6. Supabase Chat
const SUPABASE_URL = 'https://rqugwdvkmzptqjngqjxk.supabase.co'
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxdWd3ZHZr
bXpwdHFqbmdxanhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjA0MzUwNDUsImV4cCI6MjA3NjAxMTA0NX0.0Xk9a6k2H3qQm4wQ5pR6sT7uV8wX9yZ0aB1cD2eF3g'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function loadMessages() {
  const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: true })
  const messagesDiv = document.getElementById('messages')
  if(data){
    messagesDiv.innerHTML = ''
    data.forEach(msg => {
      messagesDiv.innerHTML += `<div class="message"><b>${msg.sender}:</b> ${msg.content}</div>`
    })
    messagesDiv.scrollTop = messagesDiv.scrollHeight
  }
}
async function sendMessage() {
  const input = document.getElementById('messageInput')
  if (!input.value.trim()) return
  await supabase.from('messages').insert([{ sender: 'You', content: input.value }])
  input.value = ''; loadMessages()
}
loadMessages()
setInterval(loadMessages, 3000)
</script>
</body>
</html>
