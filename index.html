<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Himansa & Sanu ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="hearts"></div>
<audio id="bgMusic" loop>
  <source src="assets/music.mp3" type="audio/mpeg">
</audio>

<!-- Welcome Screen -->
<div id="welcome">
  <h1 class="animate-drop">Himansa & Sanu ✨</h1>
  <h2 class="animate-drop-delay">Welcome To My Love ❤️</h2>
  <input type="password" id="passwordInput" placeholder="Password: 0822" maxlength="4">
  <button class="btn" onclick="checkPassword()">Enter 💘</button>
  <p>Password: 0822</p>
</div>

<!-- Main Site -->
<div id="main">
  <div class="glass">
    <h1 class="names animate-drop">Himansa & Sanu ✨</h1>
    <p class="counter">අපි ආදරේ පටන් අරන්: <span id="days">0</span> දවස් ❤️</p>
  </div>

  <!-- Photo Album -->
  <div class="glass">
    <div class="album" id="album"></div>
    <input type="file" id="photoUpload" accept="image/*" multiple style="display:none">
    <button class="btn" onclick="document.getElementById('photoUpload').click()">📸 Gallery එකෙන් Photo Add කරන්න</button>
  </div>

  <div class="glass">
    <p class="love-text">හැමදාම මාත් එක්ක ඉන්න. මං ඔයාට ගොඩක් ආදරෙයි මගේ චූටි ❤️</p>
    <textarea id="desc" placeholder="ඔයාට කැමති description එකක් මෙතන ලියන්න..."></textarea>
  </div>

  <!-- Call Room -->
  <div class="glass call-container">
    <h2>📞 Voice & Video Call</h2>
    <button class="btn call-btn" onclick="window.open('https://ourlove.daily.co/chart', '_blank')">Call Room එකට Join වෙන්න</button>
  </div>

  <!-- Chat -->
  <div class="glass chat-container">
    <h2>💬 Our Chat</h2>
    <div id="messages">Loading...</div>
    <div class="input-area">
      <input type="text" id="messageInput" placeholder="Type a message...">
      <button class="btn" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="script.js"></script>
<script src="firebase.js"></script>
</body>
</html>
