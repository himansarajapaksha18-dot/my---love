<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY LOVE ❤️</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:sans-serif;background:linear-gradient(135deg,#ff9a9e,#fecfef);margin:0;padding:20px;text-align:center;color:#fff}
h1{font-size:2.5em;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}
.chat-box{max-width:500px;margin:20px auto;background:rgba(255,255,255,0.2);border-radius:15px;padding:20px}
input,button{padding:10px;border-radius:8px;border:none;margin:5px;width:80%}
button{background:#ff6b9d;color:white;cursor:pointer;font-weight:bold}
#messages{height:250px;overflow-y:auto;background:rgba(0,0,0,0.2);border-radius:10px;padding:10px;margin:10px 0;text-align:left}
.msg{margin:5px 0;padding:8px;background:rgba(255,255,255,0.3);border-radius:8px}
</style>
</head>
<body>
<h1>MY LOVE ❤️</h1>
<p>For Himansara & You</p>

<div class="chat-box">
  <h3>Our Chat</h3>
  <div id="messages">Loading...</div>
  <input id="msg" placeholder="Type a message...">
  <button onclick="sendMsg()">Send</button>
</div>

<script>
const SUPABASE_URL = 'https://omovlihgmlulclnfhqwy.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_DfUZN5U3hU35UPFfX9_TRA_An_MB'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

async function sendMsg(){
  const msg = document.getElementById('msg').value
  if(!msg) return
  await supabase.from('messages').insert([{text: msg}])
  document.getElementById('msg').value = ''
  loadMsgs()
}

async function loadMsgs(){
  const { data } = await supabase.from('messages').select('*').order('created_at', {ascending: true})
  document.getElementById('messages').innerHTML = data.map(m=>`<div class="msg">${m.text}</div>`).join('')
}
loadMsgs()
</script>
</body>
</html>
